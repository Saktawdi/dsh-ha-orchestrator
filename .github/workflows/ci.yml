name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (src -> lib)
        run: npm run build
      - name: Syntax check (client bundle)
        run: npm run check
      - name: Unit + integration tests
        run: npm test
      - name: Offline verify
        run: npm run verify
